appId: com.tanlabs.enforse
name: Android smoke — login → home → settings → logout
tags:
  - smoke
  - android
  - ph1
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'login-submit'
    timeout: 30000
- tapOn:
    id: 'login-email'
- eraseText
- inputText: ${SMOKE_EMAIL}
- tapOn:
    id: 'login-password'
- eraseText
- inputText: ${SMOKE_PASSWORD}
- pressKey: Enter
- tapOn:
    id: 'login-submit'
- extendedWaitUntil:
    visible:
      id: 'home-settings'
    timeout: 60000
- assertVisible:
    id: 'home-settings'
- tapOn:
    id: 'home-settings'
- extendedWaitUntil:
    visible:
      id: 'settings-sign-out'
    timeout: 20000
- tapOn:
    id: 'settings-sign-out'
- extendedWaitUntil:
    visible:
      id: 'login-submit'
    timeout: 30000
- assertVisible:
    id: 'login-submit'
