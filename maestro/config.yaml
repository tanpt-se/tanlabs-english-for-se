# Maestro E2E (PH1 smoke + PH2 grammar)
#
# Install CLI: curl -fsSL "https://get.maestro.mobile.dev" | bash
# PATH: export PATH="$PATH:$HOME/.maestro/bin"
#
# Credentials (do not commit):
#   cp .env.maestro.example .env.maestro
#   # fill SMOKE_EMAIL / SMOKE_PASSWORD
#
# PH1 auth smoke:
#   pnpm run e2e:ios
#   pnpm run e2e:android
#
# PH2 grammar smoke (requires feature_grammar enabled for smoke user):
#   pnpm run e2e:ios:grammar
#   pnpm run e2e:android:grammar

flows:
  - ios/*
  - android/*
