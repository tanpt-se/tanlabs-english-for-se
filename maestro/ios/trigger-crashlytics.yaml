appId: com.tanlabs.en-for-se
name: iOS — trigger Crashlytics test crash (DEV)
tags:
  - firebase
  - crashlytics
---
- launchApp
- runFlow:
    when:
      visible:
        id: 'login-submit'
    commands:
      - tapOn:
          id: 'login-email'
      - eraseText
      - inputText: ${SMOKE_EMAIL}
      - tapOn:
          id: 'login-password'
      - eraseText
      - inputText: ${SMOKE_PASSWORD}
      - tapOn: 'Continue your SE English practice.'
      - tapOn:
          id: 'login-submit'
      - extendedWaitUntil:
          visible:
            id: 'home-settings'
          timeout: 60000
- extendedWaitUntil:
    visible:
      id: 'home-settings'
    timeout: 60000
- tapOn:
    id: 'home-settings'
- extendedWaitUntil:
    visible: 'Trigger test crash for Crashlytics'
    timeout: 20000
- tapOn: 'Trigger test crash for Crashlytics'
