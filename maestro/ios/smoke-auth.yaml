appId: com.tanlabs.en-for-se
name: iOS smoke — login → home → settings → logout
tags:
  - smoke
  - ios
  - ph1
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: 'welcome-sign-in'
    timeout: 90000
- tapOn:
    id: 'welcome-sign-in'
- extendedWaitUntil:
    visible:
      id: 'login-submit'
    timeout: 30000
- tapOn:
    id: 'login-email'
- eraseText
- inputText: ${SMOKE_EMAIL}
- tapOn:
    id: 'login-password'
- eraseText
- inputText: ${SMOKE_PASSWORD}
- hideKeyboard
- tapOn:
    id: 'login-submit'
- extendedWaitUntil:
    visible:
      id: 'bottom-nav-profile'
    timeout: 60000
- assertVisible:
    id: 'bottom-nav-home'
- tapOn:
    id: 'bottom-nav-profile'
- extendedWaitUntil:
    visible:
      id: 'settings-sign-out'
    timeout: 20000
- tapOn:
    id: 'settings-sign-out'
- extendedWaitUntil:
    visible:
      id: 'confirm-modal-confirm'
    timeout: 10000
- tapOn:
    id: 'confirm-modal-confirm'
- extendedWaitUntil:
    visible:
      id: 'welcome-sign-in'
    timeout: 30000
- assertVisible:
    id: 'welcome-sign-in'
